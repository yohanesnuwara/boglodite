[project]
name = "boglodite"
version = "0.1.0"
description = "Boglodite — agent for subsurface and geoscience, with a HITL web console"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gdown>=6.0.0",
    "tensorflow[and-cuda]>=2.21.0",
    "tf-keras>=2.21.0",
    "segyio>=1.9.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "scikit-image>=0.26.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "xtgeo>=4.27.0",
    "pydantic-ai-slim[anthropic,openai]>=2.66.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "ncs[inference]",
]

[project.scripts]
boglodite = "boglodite_ui.app:main"
boglodite-eval = "boglodite_eval.cli:main"
strata = "strata.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["boglodite_ui", "boglodite_mcp", "boglodite_eval", "norne_benchmark", "strata"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
ncs = { git = "https://github.com/NorskRegnesentral/NCS_models" }
