[project]
name = "boglodite"
version = "0.1.0"
description = "Boglodite — agent for subsurface and geoscience, with a HITL web console"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gdown>=6.0.0",
    "tensorflow[and-cuda]>=2.21.0",
    "tf-keras>=2.21.0",
    "segyio>=1.9.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "scikit-image>=0.26.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
boglodite = "boglodite_ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["boglodite_ui"]
